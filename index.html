<script>
        // إعدادات الربط مع Supabase والمفتاح الخاص بك
        const SUPABASE_URL = 'https://qqwkcmhqngxfulzpmiov.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_U3P2P_4n0wv90sYWvb3olQ_x4BolWRk';

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // جلب القرارات وتعبئتها في الموقع تلقائياً
        async function fetchDecisionsLive() {
            const { data, error } = await supabaseClient.from('decisions').select('*').order('date', { ascending: false });
            const container = document.getElementById('decisions-container'); // تأكد من مطابقة الـ ID مع عنصر عرض القرارات في تصميمك
            if (container && data) {
                container.innerHTML = data.map(item => `
                    <div class="card">
                        <span class="tag">${item.committee}</span>
                        <small style="float: left;">${item.date}</small>
                        <h3>${item.title}</h3>
                        <p>${item.summary}</p>
                    </div>
                `).join('');
            }
        }

        // تشغيل الجلب عند اكتمال تحميل الصفحة
        window.addEventListener('DOMContentLoaded', () => {
            fetchDecisionsLive();
        });
    </script>
